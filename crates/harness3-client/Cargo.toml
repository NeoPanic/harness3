[package]
name = "harness3-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
harness3-domain = { path = "../harness3-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
