[package]
name = "harness3-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
harness3 = { path = "../harness3-core" }
harness3-domain = { path = "../harness3-domain" }
harness3-plugin-protocol = { path = "../harness3-plugin-protocol" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "fs"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
