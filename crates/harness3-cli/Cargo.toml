[package]
name = "harness3-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
harness3-server = { path = "../harness3-server" }
harness3-client = { path = "../harness3-client" }
harness3-domain = { path = "../harness3-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "harness3"
path = "src/main.rs"
doc = false

[dev-dependencies]
harness3-platform = { path = "../harness3-platform" }
harness3-worker = { path = "../harness3-worker" }
harness3-models = { path = "../harness3-models" }
harness3-plugins = { path = "../harness3-plugins" }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
