[package]
name = "harness3-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Local Harness³ control plane and inspection console"

[[bin]]
name = "harness3"
path = "src/main.rs"
doc = false

[dependencies]
harness3 = { path = "../.." }
harness3-plugin-protocol = { path = "../harness3-plugin-protocol" }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-std", "io-util", "process", "fs"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
