[package]
name = "harness3-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Local Harness³ control plane and inspection console"

[dependencies]
harness3-builtin-plugins = { path = "../../plugins" }
harness3-storage = { path = "../harness3-storage" }
harness3-domain = { path = "../harness3-domain" }
harness3-models = { path = "../harness3-models" }
harness3-plugins = { path = "../harness3-plugins" }
harness3 = { path = "../harness3-core" }
harness3-plugin-protocol = { path = "../harness3-plugin-protocol" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
