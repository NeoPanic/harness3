[package]
name = "harness3-builtin-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
harness3 = { path = "../crates/harness3-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "time", "macros"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
