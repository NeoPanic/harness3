name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: python3 scripts/render-progress.py --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: node --check crates/harness3-platform/web/app.js && node --check crates/harness3-platform/web/verification.js && node --check crates/harness3-platform/web/tasks.js && node --check crates/harness3-platform/web/goals.js && node --check crates/harness3-platform/web/fleets.js && node --check crates/harness3-platform/web/plugins.js && node --check crates/harness3-platform/web/presets.js && node --check crates/harness3-platform/web/messages.js && node --check crates/harness3-platform/web/research.js && node --check crates/harness3-platform/web/artifacts.js && node --check crates/harness3-platform/web/collaboration.js
      - run: cargo run --locked --example quickstart
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
